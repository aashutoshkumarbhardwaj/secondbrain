<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Diary — Daily Plan & Live Updates</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: rgba(255, 255, 255, 0.88);
      --border: rgba(0, 0, 0, 0.08);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --blue: #0071e3;
      --green: #28cd41;
      --orange: #ff9500;
      --pill: rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: rgba(28, 28, 30, 0.85);
        --border: rgba(255, 255, 255, 0.1);
        --text: #f5f5f7;
        --muted: #98989d;
        --blue: #0a84ff;
        --green: #30d158;
        --orange: #ff9f0a;
        --pill: rgba(255, 255, 255, 0.08);
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 28px 18px 64px;
      line-height: 1.45;
    }
    .wrap { max-width: 1020px; margin: 0 auto; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end;
      gap: 12px; margin-bottom: 24px;
    }
    h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; }
    .sub { font-size: 0.92rem; color: var(--muted); margin-top: 2px; }
    .controls { display: flex; gap: 10px; align-items: center; }
    input[type="date"] {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 14px; font-size: 0.85rem; font-weight: 600;
      font-family: inherit; outline: none;
    }
    .sync-pill {
      font-size: 0.78rem; font-weight: 500; color: var(--muted);
      background: var(--card); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 999px;
    }
    .summary-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px;
    }
    @media (max-width: 680px) { .summary-grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 20px; box-shadow: var(--shadow);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .stat-label { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
    .stat-num { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.03em; margin-top: 4px; }
    .columns {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 26px;
    }
    @media (max-width: 860px) { .columns { grid-template-columns: 1fr; } }
    .col-head {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.9rem; font-weight: 700; margin-bottom: 14px;
    }
    .badge {
      font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px;
      background: var(--pill); color: var(--muted);
    }
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 13px 15px;
    }
    .task-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .task-title { font-size: 0.93rem; font-weight: 600; }
    .task-title.done-text { text-decoration: line-through; color: var(--muted); }
    .task-note { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
    .task-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 8px; font-size: 0.74rem; color: var(--muted);
    }
    .cat { background: var(--pill); padding: 2px 8px; border-radius: 999px; font-weight: 600; color: var(--text); }
    .diary-section h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.02em; }
    .timeline { display: flex; flex-direction: column; gap: 10px; }
    .entry {
      display: flex; gap: 14px; align-items: flex-start;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px 18px; box-shadow: var(--shadow);
    }
    .entry-time { font-size: 0.78rem; font-weight: 600; color: var(--blue); min-width: 72px; padding-top: 2px; }
    .entry-body { font-size: 0.92rem; }
    .empty { color: var(--muted); font-size: 0.86rem; padding: 18px 0; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Digital Diary</h1>
        <div class="sub" id="dateHeading">Today's Plan, Active Focus &amp; Completed Work</div>
      </div>
      <div class="controls">
        <input type="date" id="datePicker" />
        <div class="sync-pill" id="syncTime">Waiting for first entry</div>
      </div>
    </header>

    <div class="summary-grid">
      <div class="card">
        <div class="stat-label">Need To Do</div>
        <div class="stat-num" style="color: var(--orange);" id="todoCount">0</div>
      </div>
      <div class="card">
        <div class="stat-label">Doing Right Now</div>
        <div class="stat-num" style="color: var(--blue);" id="doingCount">0</div>
      </div>
      <div class="card">
        <div class="stat-label">Completed</div>
        <div class="stat-num" style="color: var(--green);" id="doneCount">0</div>
      </div>
    </div>

    <div class="columns">
      <div class="card">
        <div class="col-head"><span>Need To Do</span><span class="badge" id="todoBadge">0</span></div>
        <div class="task-list" id="todoList"></div>
      </div>
      <div class="card">
        <div class="col-head"><span>Doing Now</span><span class="badge" id="doingBadge">0</span></div>
        <div class="task-list" id="doingList"></div>
      </div>
      <div class="card">
        <div class="col-head"><span>Did Today</span><span class="badge" id="doneBadge">0</span></div>
        <div class="task-list" id="doneList"></div>
      </div>
    </div>

    <div class="diary-section">
      <h2>Live Diary Stream</h2>
      <div class="timeline" id="diaryStream"></div>
    </div>
  </div>

  <script>
    let diaryData = { days: {} };

    function renderDay(selectedDate) {
      const day = (diaryData.days && diaryData.days[selectedDate]) || { tasks: [], notes: [] };
      const tasks = day.tasks || [];
      const notes = day.notes || [];

      const todo = tasks.filter(t => t.status === 'todo');
      const doing = tasks.filter(t => t.status === 'doing');
      const done = tasks.filter(t => t.status === 'done');

      document.getElementById('todoCount').textContent = todo.length;
      document.getElementById('doingCount').textContent = doing.length;
      document.getElementById('doneCount').textContent = done.length;
      document.getElementById('todoBadge').textContent = todo.length;
      document.getElementById('doingBadge').textContent = doing.length;
      document.getElementById('doneBadge').textContent = done.length;

      const renderCards = (items, emptyMsg, isDone = false) => {
        if (!items.length) return `<div class="empty">${emptyMsg}</div>`;
        return items.map(t => `
          <div class="task">
            <div class="task-top">
              <div class="task-title ${isDone ? 'done-text' : ''}">${t.title}</div>
            </div>
            ${t.note ? `<div class="task-note">${t.note}</div>` : ''}
            <div class="task-meta">
              <span class="cat">${t.category || 'General'}</span>
              <span>${t.updated_at || ''}</span>
            </div>
          </div>
        `).join('');
      };

      document.getElementById('todoList').innerHTML = renderCards(todo, 'Nothing queued yet.');
      document.getElementById('doingList').innerHTML = renderCards(doing, 'No active task right now.');
      document.getElementById('doneList').innerHTML = renderCards(done, 'Nothing completed yet.', true);

      const stream = document.getElementById('diaryStream');
      if (!notes.length) {
        stream.innerHTML = `<div class="card empty">No diary updates logged for ${selectedDate}. Message Hermes on Telegram to add your plan or progress.</div>`;
      } else {
        stream.innerHTML = [...notes].reverse().map(n => `
          <div class="entry">
            <div class="entry-time">${n.time}</div>
            <div class="entry-body">${n.text}</div>
          </div>
        `).join('');
      }
    }

    fetch('diary.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        diaryData = data;
        const picker = document.getElementById('datePicker');
        const defaultDate = data.latest_date || new Date().toISOString().slice(0, 10);
        picker.value = defaultDate;
        document.getElementById('syncTime').textContent = data.updated_at ? `Updated ${data.updated_at}` : 'Live';
        picker.onchange = () => renderDay(picker.value);
        renderDay(defaultDate);
      });
  </script>
</body>
</html>
